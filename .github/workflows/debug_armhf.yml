name: Debug — armhf native build (via arm64 runner + SSH)

on:
  workflow_dispatch:

# Job runs on a supported arm64 self-hosted runner and builds natively on a
# remote armhf host over SSH. Set repository variable ARMHF_BUILD_HOST.
jobs:
  build-armhf-native:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Jump-host system info
        run: |
          uname -a
          echo "runner_arch=$(uname -m) dpkg=$(dpkg --print-architecture 2>/dev/null || true)"
          openssl version
          python3 --version

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Require ARMHF_BUILD_HOST
        env:
          HOST: ${{ vars.ARMHF_BUILD_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::Set repository variable ARMHF_BUILD_HOST (SSH destination)."
            exit 1
          fi
          echo "ARMHF_BUILD_HOST configured (length=${#HOST})"

      - name: Remote native armhf build (via SSH)
        env:
          ARMHF_BUILD_HOST: ${{ vars.ARMHF_BUILD_HOST }}
        run: ./bin/ci/build-meshtasticd-armhf-remote.sh

      - uses: actions/upload-artifact@v6
        with:
          name: meshtasticd-armhf
          path: meshtasticd-armhf
